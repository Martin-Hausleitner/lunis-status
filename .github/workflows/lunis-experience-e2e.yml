name: Lunis Experience — deploy and cloud E2E
on:
  push:
    branches: [main]
    paths:
      - 'assets/style.css'
      - 'assets/brand/**'
      - 'experience/index.html'
      - 'experience/app.js'
      - 'experience/style.css'
      - 'experience/brand.svg'
      - 'experience/tests/**'
      - 'experience/report-src/**'
      - '.github/workflows/lunis-experience-e2e.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: lunis-experience-production
  cancel-in-progress: false
jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned build and test tools outside repository
        run: |
          export LUNIS_TOOLS="$RUNNER_TEMP/lunis-tools"
          echo "LUNIS_TOOLS=$LUNIS_TOOLS" >> "$GITHUB_ENV"
          mkdir -p "$LUNIS_TOOLS"
          npm install --prefix "$LUNIS_TOOLS" --ignore-scripts --no-audit --no-fund @playwright/test@1.55.1 @supabase/supabase-js@2.95.3 @fontsource/manrope@5.2.5
      - name: Build and validate complete application
        run: |
          node experience/tests/polish.mjs
          node experience/tests/readiness.mjs
          node experience/tests/ui-contract.mjs
          python experience/report-src/patch-test.py
          node --check experience/tests/readiness-cloud.mjs
          node --check experience/tests/cleanup.mjs
          node --check experience/tests/cloud.mjs
          node --check experience/tests/report-v4.mjs
          node experience/tests/build.mjs
      - name: Build report V4 and prepare verified public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python experience/report-src/build.py
          python experience/report-src/prepare.py
          python experience/report-src/finalize.py
      - name: Install Chromium for authorized CI browser tests
        run: '$LUNIS_TOOLS/node_modules/.bin/playwright install --with-deps chromium'
      - name: Test all new report pages before publishing
        timeout-minutes: 6
        run: |
          node experience/tests/report-v4.mjs
          python experience/report-src/publish-notes.py
          python experience/report-src/finalize.py
      - name: Save only generated public application and report files to main
        run: |
          git config user.name 'Lunis Build'
          git config user.email 'lunis-build@users.noreply.github.com'
          git add experience/index.html experience/app.js experience/style.css experience/icon.svg experience/manifest.webmanifest experience/sw.js experience/build.json experience/vendor experience/tests/cloud.mjs experience/tests/report-v4.mjs experience/bericht proof/report-v4 README.md
          if ! git diff --cached --quiet; then
            git commit -m 'build(report): verify V4 and preserve Supabase portal [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not fast-forward generated build after 3 attempts" >&2
                exit 1
              fi
            done
          fi
      - name: Prepare Pages artifact without tests or credentials
        run: |
          mkdir _site
          for item in index.html live.html assets berichte downloads experience .nojekyll; do
            if [ -e "$item" ]; then cp -a "$item" _site/; fi
          done
          rm -rf _site/experience/tests _site/experience/report-src
          touch _site/.nojekyll
          test -s _site/experience/index.html
          test -s _site/experience/vendor/supabase-2.95.3.js
          test -s _site/experience/bericht/index.html
          test -s _site/experience/bericht/exports/Lunis-Bericht-V4.zip
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy complete frontend
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Test actual public website against live Supabase
        timeout-minutes: 10
        run: node experience/tests/cloud.mjs
      - name: Verify deployed V4 files, pages and interactions
        timeout-minutes: 6
        run: node experience/tests/report-v4.mjs --live
      - name: Independently clean synthetic test fixtures even after a runner error
        if: always()
        timeout-minutes: 4
        run: node experience/tests/cleanup.mjs
      - name: Upload genuine browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lunis-cloud-evidence-${{ github.run_id }}
          path: proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload reproducible frontend and report package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lunis-experience-clean-${{ github.run_id }}
          path: _site/experience/
          if-no-files-found: warn
          retention-days: 14
