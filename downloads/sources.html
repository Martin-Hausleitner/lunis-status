<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunis · Öffentliche Quellen</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><main class="download-document"><p><a href="../index.html#downloads">← Zurück zu Downloads</a></p><h1>Öffentliche Quellen</h1><p>Sanitisierte Quellenliste: <a href="sources.md" download>sources.md herunterladen</a>.</p><div id="sourcesContent" aria-live="polite">Quellenliste wird geladen …</div></main>
<script>
(function () {
  var output = document.getElementById('sourcesContent');
  function safeHref(value) {
    if (typeof value !== 'string') return null;
    var candidate = value.trim();
    if (!candidate || /[\\]/.test(candidate)) return null;
    try {
      var decoded = candidate;
      for (var pass = 0; pass < 3; pass++) {
        var next = decodeURIComponent(decoded);
        if (next === decoded) break;
        decoded = next;
      }
      if (/[\\]/.test(decoded) || /^(?:\/|\/\/)/.test(decoded)) return null;
      var path = decoded.split(/[?#]/, 1)[0];
      if (/(^|\/)\.\.?($|\/)/.test(path)) return null;
      var url = new URL(candidate, window.location.href);
      if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
      if (url.origin === window.location.origin) return url.href;
    } catch (error) {}
    return null;
  }
  function inline(parent, value) {
    var pattern = /\[([^\]]+)\]\(([^)]+)\)|<(https?:\/\/[^>]+)>/g;
    var cursor = 0, match;
    while ((match = pattern.exec(value))) {
      if (match.index > cursor) parent.appendChild(document.createTextNode(value.slice(cursor, match.index)));
      var label = match[1] || match[3], href = safeHref(match[2] || match[3]);
      if (href) { var link = document.createElement('a'); link.href = href; link.textContent = label; link.rel = 'noreferrer'; parent.appendChild(link); }
      else parent.appendChild(document.createTextNode(label));
      cursor = pattern.lastIndex;
    }
    if (cursor < value.length) parent.appendChild(document.createTextNode(value.slice(cursor)));
  }
  function render(markdown) {
    var fragment = document.createDocumentFragment(), list = null;
    markdown.split(/\r?\n/).forEach(function (line) {
      var heading = line.match(/^(#{1,3})\s+(.+)$/), bullet = line.match(/^[-*]\s+(.+)$/);
      if (heading) { list = null; var title = document.createElement('h' + heading[1].length); inline(title, heading[2]); fragment.appendChild(title); return; }
      if (bullet) { if (!list) { list = document.createElement('ul'); fragment.appendChild(list); } var item = document.createElement('li'); inline(item, bullet[1]); list.appendChild(item); return; }
      list = null; if (line.trim()) { var paragraph = document.createElement('p'); inline(paragraph, line); fragment.appendChild(paragraph); }
    });
    output.replaceChildren(fragment);
  }
  fetch('sources.md').then(function (response) { if (!response.ok) throw new Error('sources.md unavailable'); return response.text(); }).then(render).catch(function () { output.textContent = 'Quellenliste als Download öffnen.'; });
}());
</script></body></html>
